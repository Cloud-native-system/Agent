spring.application.name=Agent
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_MODEL}

logging.level.web=DEBUG
logging.level.io.github.resilience4j.ratelimiter=DEBUG
logging.level.io.github.resilience4j.spring6.ratelimiter.configure=DEBUG
logging.level.cloudNative.Agent=DEBUG

resilience4j.ratelimiter.instances.openAIServiceRateLimiter.limitForPeriod=5
resilience4j.ratelimiter.instances.openAIServiceRateLimiter.limitRefreshPeriod=60000
resilience4j.ratelimiter.instances.openAIServiceRateLimiter.timeoutDuration=0
